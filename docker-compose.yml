name: startkey

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-startkey}
      POSTGRES_USER: ${DB_USERNAME:-startkey}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-startkey} -d ${DB_DATABASE:-startkey}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: Startkey
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:?APP_KEY is required, run ./start.sh to generate one}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: http://localhost:${API_PORT:-8080}
      APP_LOCALE: tr
      APP_FALLBACK_LOCALE: tr
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-startkey}
      DB_USERNAME: ${DB_USERNAME:-startkey}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      RECAPTCHA_V3_SECRET_KEY: ${RECAPTCHA_V3_SECRET_KEY:-}
      RECAPTCHA_V3_MIN_SCORE: ${RECAPTCHA_V3_MIN_SCORE:-0.5}
      REONIX_BASE_URL: ${REONIX_BASE_URL:-}
      REONIX_PORTAL_KEY: ${REONIX_PORTAL_KEY:-}
      REONIX_NETWORK_SLUG: ${REONIX_NETWORK_SLUG:-startkey}
      FORCE_DB_SEED: ${FORCE_DB_SEED:-}
    volumes:
      - ./api:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "pgrep php-fpm >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      # Full office/consultant/listing seed exceeds 2 minutes on a cold start.
      start_period: 600s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_started
    ports:
      - "${API_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api:/var/www/html:ro
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        NEXT_PUBLIC_REONIX_URL: ${NEXT_PUBLIC_REONIX_URL:-}
        NEXT_PUBLIC_RECAPTCHA_V3_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_V3_SITE_KEY:-}
        NEXT_PUBLIC_MAP_STYLE: ${NEXT_PUBLIC_MAP_STYLE:-}
        NEXT_PUBLIC_MAP_SATELLITE_URL: ${NEXT_PUBLIC_MAP_SATELLITE_URL:-}
        NEXT_PUBLIC_MAP_SATELLITE_ATTRIBUTION: ${NEXT_PUBLIC_MAP_SATELLITE_ATTRIBUTION:-}
    depends_on:
      nginx:
        condition: service_started
    environment:
      API_BASE_URL: http://nginx
      NEXT_PUBLIC_REONIX_URL: ${NEXT_PUBLIC_REONIX_URL:-}
      NEXT_PUBLIC_RECAPTCHA_V3_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_V3_SITE_KEY:-}
      NEXT_PUBLIC_MAP_STYLE: ${NEXT_PUBLIC_MAP_STYLE:-}
      NEXT_PUBLIC_MAP_SATELLITE_URL: ${NEXT_PUBLIC_MAP_SATELLITE_URL:-}
      NEXT_PUBLIC_MAP_SATELLITE_ATTRIBUTION: ${NEXT_PUBLIC_MAP_SATELLITE_ATTRIBUTION:-}
    volumes:
      # Host copy is the source of truth. The image does not contain these files.
      - ./web/public/media:/app/public/media:ro
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/tr').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
